<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="hair" d="M70 110 C 64 84, 76 60, 102 52 C 108 44, 120 40, 132 44 C 156 46, 174 64, 172 92 C 172 99, 171 105, 169 110 C 164 98, 154 90, 140 87 C 132 85, 124 85, 116 86 C 102 88, 86 92, 76 102 C 73 104, 71 107, 70 110 Z"/>
    <path id="face" d="M72 104 C 80 94, 160 94, 168 104 L 168 148 C 168 170, 158 186, 142 198 C 132 205, 108 205, 98 198 C 82 186, 72 170, 72 148 Z"/>
    <ellipse id="earL" cx="67" cy="146" rx="9" ry="14"/>
    <ellipse id="earR" cx="173" cy="146" rx="9" ry="14"/>
  </defs>

  <!-- sticker border -->
  <g fill="#FEFEFE" stroke="#FEFEFE" stroke-width="20" stroke-linejoin="round" stroke-linecap="round">
    <use href="#hair"/><use href="#earL"/><use href="#earR"/><use href="#face"/>
  </g>

  <!-- ears + earpiece -->
  <use href="#earL" fill="#F2C3A0" stroke="#0D0D0D" stroke-width="6"/>
  <use href="#earR" fill="#F2C3A0" stroke="#0D0D0D" stroke-width="6"/>
  <path d="M171 140 C 175 144, 175 149, 171 153" stroke="#CC906A" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="67" cy="147" r="5.5" fill="#1C1C22" stroke="#0D0D0D" stroke-width="2.5"/>
  <circle cx="65.5" cy="145.5" r="1.6" fill="#FEFEFE"/>

  <!-- face (sharp jaw) -->
  <use href="#face" fill="#F2C3A0" stroke="#0D0D0D" stroke-width="6" stroke-linejoin="round"/>
  <!-- skin fade on the sides -->
  <path d="M75 106 C 74 114, 74 122, 75 130 L 82 128 C 81 120, 81 113, 83 106 Z M165 106 C 166 114, 166 122, 165 130 L 158 128 C 159 120, 159 113, 157 106 Z" fill="#B8BCC6"/>

  <!-- hair: platinum, slicked back with a swept quiff -->
  <use href="#hair" fill="#EEF0F5" stroke="#0D0D0D" stroke-width="6" stroke-linejoin="round"/>
  <path d="M84 96 C 92 80, 108 68, 128 64 M100 88 C 110 76, 128 70, 150 70 M120 86 C 132 80, 148 80, 162 88 M108 58 C 120 52, 138 52, 152 58" stroke="#B9C0CE" stroke-width="4.5" stroke-linecap="round"/>

  <!-- eyebrows (one raised) -->
  <path d="M84 113 C 91 107, 103 106, 111 109 L 110 114 C 102 112, 93 113, 86 117 Z" fill="#4A3A30" stroke="#0D0D0D" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M156 106 C 149 99, 137 99, 129 102 L 130 108 C 138 106, 147 107, 154 111 Z" fill="#4A3A30" stroke="#0D0D0D" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- slim wraparound sport sunglasses: gold frame, cobalt mirror lenses -->
  <path d="M68 125 C 92 118, 148 118, 172 125 L 167 134 C 158 142, 138 143, 126 137 C 122 135, 118 135, 114 137 C 102 143, 82 142, 73 134 Z" fill="#2F6BFF" stroke="#0D0D0D" stroke-width="5.5" stroke-linejoin="round"/>
  <path d="M73 124 C 95 118.5, 145 118.5, 167 124" stroke="#F6B93B" stroke-width="4" stroke-linecap="round"/>
  <path d="M88 136 L 95 127 M144 136 L 151 127" stroke="#9DB8FF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M113 156 C 117 161, 123 161, 127 156" stroke="#0D0D0D" stroke-width="4.5" stroke-linecap="round"/>

  <!-- wide bright smile -->
  <path d="M90 170 C 102 190, 138 190, 150 170 C 134 176, 106 176, 90 170 Z" fill="#FEFEFE" stroke="#0D0D0D" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M86 166 C 88 169, 90 170, 92 170 M154 166 C 152 169, 150 170, 148 170" stroke="#0D0D0D" stroke-width="3.5" stroke-linecap="round"/>
</svg>
